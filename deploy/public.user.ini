; Batas PHP untuk upload Excel BNI, foto santri, dan ZIP paket deploy CI/CD.
; Berlaku untuk Apache/LiteSpeed dengan PHP-FPM/CGI (umum di cPanel).
; Jika tidak berlaku (cache LiteSpeed +-5 menit), atur juga lewat
; cPanel > MultiPHP INI Editor untuk subdomain Anda.

upload_max_filesize = 48M
post_max_size = 64M
max_execution_time = 120
memory_limit = 256M
